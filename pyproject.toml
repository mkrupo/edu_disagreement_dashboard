[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-disagreement"
version = "0.1.0"
description = "Deterministic comparison of two EDU segmentations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
